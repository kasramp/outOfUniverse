baseURL = "https://outofuniverse.madadipouya.com/"
title = "Out of Universe"
theme = "PaperMod"
locale = "en"
enableRobotsTXT = true
enableEmoji = true

[markup.goldmark.renderer]
  unsafe = true  # posts embed tweets and YouTube iframes

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

[[menu.main]]
  name = "Archives"
  url = "/archives/"
  weight = 10
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 20
[[menu.main]]
  name = "Categories"
  url = "/categories/"
  weight = 30
[[menu.main]]
  name = "Personal blog"
  url = "https://geekyhacker.com"
  weight = 60

[params]
  env = "production"
  author = "Kasra Madadipouya"
  description = "Astronomy posts by a computer geek."
  keywords = ["astronomy", "space", "Mars", "extraterrestrial life"]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  ShowFullTextinRSS = true
  mainSections = ["post"]

  [params.homeInfoParams]
    Title = "Out of Universe"
    Content = "Astronomy posts by a computer geek."

  [[params.socialIcons]]
    name = "email"
    url = "mailto:kasra@madadipouya.com"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/kasra_mp"
  [[params.socialIcons]]
    name = "mastodon"
    url = "https://mastodon.social/@kasra_mp"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.footer]
    text = '<a rel="license noopener" href="https://creativecommons.org/licenses/by-nc-nd/4.0/" target="_blank">CC BY-NC-ND 4.0</a>'
